<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>霓虹射手 Neon Shooter 3D</title>
  <meta name="description" content="浏览器可玩的第三人称霓虹 3D 射击小游戏（GLTF 人形 + 手持武器）" />
  <link rel="stylesheet" href="css/style.css" />
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div id="game-root">
    <canvas id="c"></canvas>
    <div id="menu" class="overlay panel">
      <div class="panel-inner">
        <h1 class="title neon-text">霓虹射手</h1>
        <p class="subtitle">NEON SHOOTER 3D</p>
        <p class="hint">第三人称过肩视角 · GLTF 人形角色 · 手持武器 · 三场景闯关</p>
        <div class="level-grid" id="level-grid"></div>
        <button id="btn-start" class="btn primary">开始游戏</button>
        <div class="controls-help">
          <span><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> 移动</span>
          <span><kbd>鼠标</kbd> 瞄准</span>
          <span><kbd>左键</kbd> 射击</span>
          <span><kbd>空格</kbd> 跳跃</span>
          <span><kbd>R</kbd> 换弹</span>
          <span><kbd>Esc</kbd> 暂停</span>
        </div>
      </div>
    </div>
    <div id="hud" class="hidden">
      <div class="hud-top">
        <div class="hud-block"><span class="label">分数</span><span id="hud-score" class="value">0</span></div>
        <div class="hud-block"><span class="label">场景</span><span id="hud-scene" class="value">—</span></div>
        <div class="hud-block"><span class="label">波次</span><span id="hud-wave" class="value">1</span></div>
      </div>
      <div class="hud-bottom">
        <div class="bar-wrap"><span class="label">生命</span><div class="bar"><div id="hp-fill" class="fill hp"></div></div><span id="hud-hp" class="value">100</span></div>
        <div class="crosshair" id="crosshair">+</div>
        <div class="bar-wrap ammo"><span class="label">弹药</span><span id="hud-ammo" class="value">30 / 90</span></div>
      </div>
      <div id="toast" class="toast hidden"></div>
    </div>
    <div id="pause" class="overlay panel hidden">
      <div class="panel-inner">
        <h2 class="neon-text">暂停</h2>
        <button id="btn-resume" class="btn primary">继续游戏</button>
        <button id="btn-restart" class="btn">重新开始</button>
        <button id="btn-menu" class="btn">返回菜单</button>
      </div>
    </div>
    <div id="end" class="overlay panel hidden">
      <div class="panel-inner">
        <h2 id="end-title" class="neon-text">游戏结束</h2>
        <p id="end-msg" class="subtitle"></p>
        <p class="score-line">最终分数：<strong id="end-score">0</strong></p>
        <button id="btn-next" class="btn primary hidden">下一关</button>
        <button id="btn-retry" class="btn">重新开始</button>
        <button id="btn-end-menu" class="btn">返回菜单</button>
      </div>
    </div>
    <div id="pointer-hint" class="pointer-hint hidden">点击画面锁定鼠标</div>
  </div>
  <script type="module" src="js/game.js"></script>
</body>
</html>
